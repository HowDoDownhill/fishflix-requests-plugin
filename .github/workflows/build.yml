name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # v1.2 -> 1.2.0.0, v1.2.3 -> 1.2.3.0
            IFS=. read -r a b c d <<< "${GITHUB_REF_NAME#v}"
            VERSION="${a:-0}.${b:-0}.${c:-0}.${d:-0}"
          else
            VERSION=$(grep -oP '(?<=^version: ")[^"]+' build.yaml)
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ABI=$(grep -oP '(?<=^targetAbi: ")[^"]+' build.yaml)" >> "$GITHUB_ENV"
          echo "ZIP=fishflix-requests_$VERSION.zip" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test Jellyfin.Plugin.FishflixRequests.slnx --configuration Release

      - name: Publish
        run: >
          dotnet publish Jellyfin.Plugin.FishflixRequests/Jellyfin.Plugin.FishflixRequests.csproj
          --configuration Release --output publish
          -p:Version=$VERSION -p:AssemblyVersion=$VERSION -p:FileVersion=$VERSION

      - name: Package
        run: |
          mkdir -p package
          cp publish/Jellyfin.Plugin.FishflixRequests.dll package/
          cat > package/meta.json <<JSON
          {
            "category": "General",
            "changelog": "",
            "description": "View Jellyseerr requests by user and track their progress.",
            "guid": "40dc34ee-7e8d-4ebc-b34d-cc1253f07de0",
            "name": "Fishflix Requests",
            "overview": "View Jellyseerr requests by user and track their progress",
            "owner": "HowDoDownhill",
            "targetAbi": "$ABI",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "version": "$VERSION",
            "status": "Active",
            "autoUpdate": true,
            "assemblies": ["Jellyfin.Plugin.FishflixRequests.dll"]
          }
          JSON
          (cd package && zip -r "../$ZIP" .)

      - uses: actions/upload-artifact@v4
        with:
          name: fishflix-requests
          path: ${{ env.ZIP }}

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
          generate_release_notes: true

      - name: Update plugin repository manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          CHECKSUM=$(md5sum "$ZIP" | cut -d' ' -f1)
          SOURCE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$ZIP"
          CHANGELOG="https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          git fetch origin main
          git checkout -B main origin/main

          jq --arg version "$VERSION" --arg abi "$ABI" --arg url "$SOURCE_URL" \
             --arg checksum "$CHECKSUM" --arg changelog "$CHANGELOG" --arg ts "$TIMESTAMP" '
            def entry: {
              guid: "40dc34ee-7e8d-4ebc-b34d-cc1253f07de0",
              name: "Fishflix Requests",
              description: "Shows every Jellyseerr/Overseerr request grouped by the user who made it, with its status and live download progress from Sonarr/Radarr.",
              overview: "View Jellyseerr requests by user and track their progress",
              owner: "HowDoDownhill",
              category: "General",
              versions: []
            };
            (if any(.[]; .guid == entry.guid) then . else . + [entry] end)
            | map(if .guid == entry.guid then
                .versions = ([{version: $version, changelog: $changelog, targetAbi: $abi,
                               sourceUrl: $url, checksum: $checksum, timestamp: $ts}]
                             + [.versions[] | select(.version != $version)])
              else . end)
          ' manifest.json > manifest.tmp && mv manifest.tmp manifest.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Publish $GITHUB_REF_NAME to plugin repository"
          git push origin main
